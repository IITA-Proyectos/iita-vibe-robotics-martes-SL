; PlatformIO — compilar y cargar ESTRATEGIA 2 (el arquero a caballo de la linea del area).
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/estrategia-2

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
