; PlatformIO — compilar y cargar buscar el giroscopio en el bus I2C.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/buscar-i2c

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
