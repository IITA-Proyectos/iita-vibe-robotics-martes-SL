; PlatformIO — derecho y vuelta: cuanto se tuerce el robot al avanzar.
[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/derecho-y-vuelta

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
