; PlatformIO — el BNO055 con la libreria de DFRobot, no la de Adafruit.
[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/giroscopo-dfrobot

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    https://github.com/DFRobot/DFRobot_BNO055.git
