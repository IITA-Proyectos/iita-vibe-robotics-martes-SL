; PlatformIO — volver al centro del arco usando las lineas.
[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/ir-al-medio

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
