; PlatformIO — TABLERO del ARQUERO (el programa del robot que va con la ventana).
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; build_dir = tablero-arquero y NO "tablero": ese es el del DELANTERO, y si
; los dos compilan en la misma carpeta se pisan (2026-11-03).
; upload_protocol = teensy-cli: el del arquero. cargar.py lo usa con
; "-e teensy41" y antes mata teensy.exe (el delantero usa teensy-gui).
;
; La primera compilacion baja las librerias a pruebas/tablero/.pio/libdeps
; (necesita internet). Si no hay internet: COPIAR (no mover)
; pruebas/ajustar-movimientos/.pio/libdeps/teensy41 a
; pruebas/tablero/.pio/libdeps/teensy41. Compilarlo ANTES del viaje.
; Si algun dia falla con "SPI.h: No such file", agregar SPI a lib_deps,
; como hizo el delantero.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/tablero-arquero

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
