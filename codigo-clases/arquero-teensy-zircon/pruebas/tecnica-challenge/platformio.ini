; PlatformIO - compilar y cargar la tecnica challenge (el recorrido de los arcos).
; Mismo patron que funciona/partido-0921/platformio.ini (misma profundidad
; de carpetas): solo cambia la carpeta donde quedan los compilados.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/tecnica-challenge

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
