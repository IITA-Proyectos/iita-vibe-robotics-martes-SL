; PlatformIO — RESPALDO de la estrategia 2 version A ("a caballo" de la linea del area, 09/11).
; La que se usa es funciona/estrategia-2 (version B). Tambien se abre con el Arduino IDE (Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/estrategia-2-a-caballo

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
