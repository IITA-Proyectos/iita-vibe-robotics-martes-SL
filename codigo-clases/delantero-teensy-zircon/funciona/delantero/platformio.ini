[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/firmware-delantero
; Sin -e se compila SOLO este. Sin esta linea, "pio run -t upload" cargaria
; los tres programas de abajo uno atras del otro (y quedaria el ultimo).
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
; El giroscopio BNO055. Las mismas dos librerias que usa el cuadrado-giroscopo
; del arquero, asi los dos robots hablan con el sensor igual.
;
; SPI va explicito aunque el .ino no lo incluya: Adafruit BusIO (que entra sola
; como dependencia del BNO055) tiene un Adafruit_SPIDevice.h que hace #include
; <SPI.h>. El buscador de dependencias de PlatformIO solo mira los #include de
; NUESTRO .ino, que pide Wire y no SPI, asi que sin esta linea no le pasa el SPI
; del framework de Teensy al compilador y el build muere con
; "fatal error: SPI.h: No such file or directory".
; Aparecio el 25/08 al bajar BusIO 1.17.4; con la version vieja que habia en
; cache el 18/08 no pasaba. No es el robot: es deriva de version de la libreria.
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI

; ---------------------------------------------------------------------------
; LOS DOS PROGRAMAS DE PARTIDO [2026-09-21] — el mismo codigo, un arco fijo.
; Al arrancar, los robots rivales tapan el arco y el robot no llega a elegirlo
; mirando. El juez permite dos programas: se carga el que toque despues del
; sorteo de lado, con ../../CARGAR-ROBOT.bat (o a mano: pio run -e azul -t upload).
; Heredan TODO de [env:teensy41]; lo unico distinto es el arco.
[env:azul]
extends = env:teensy41
build_flags = -D ATACAR_AZUL

[env:amarillo]
extends = env:teensy41
build_flags = -D ATACAR_AMARILLO
