; PlatformIO — CALIBRACION BUSQUEDA: buscar la pelota y llegar, nada mas.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; 🚨 MUEVE EL ROBOT. Va en el piso o en la cancha, NO en la mesa.
; No patea, no orbita y no escapa de la linea: todo eso esta sacado a
; proposito para que no ensucie la medicion.
;
; Corre las dos versiones de la pausa (frenando y soltando) y las compara.
; Los resultados quedan en RAM y se leen despues enchufando el USB SIN
; apagar la bateria.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/calibracion-busqueda

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI
