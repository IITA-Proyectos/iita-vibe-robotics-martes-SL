; PlatformIO — CALIBRACION MOVIENDO: un numero por cada cosa que hace el robot.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; 🚨 MUEVE EL ROBOT. Va EN EL PISO o EN LA CANCHA, con espacio libre alrededor.
; NO en la mesa: se cae. Y nadie con las manos cerca.
;
; Mide las 6 cosas, con las mismas constantes del firmware: piso de PWM rueda
; por rueda, avanzar derecho, girar buscando, centrar a pulsos, orbitar y
; escapar de linea. La PATADA no esta aca a proposito: ya se mide en el
; firmware y en pruebas/patada-derecha/, y una tercera version que midiera
; distinto solo traeria conclusiones equivocadas (paso el 06/10).
;
; Pensado para usarse SIN CABLE: se carga, se desenchufa el USB con la BATERIA
; PUESTA, se lo deja hacer las 6 fases en el piso, y se vuelve a enchufar SIN
; APAGAR LA BATERIA para leer el informe (queda en RAM y se repite cada 3 s).
;
; El companero de este es pruebas/calibracion-quieto/, que mide lo que NO se
; mueve: linea, giroscopio y camara.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/calibracion-moviendo

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI
