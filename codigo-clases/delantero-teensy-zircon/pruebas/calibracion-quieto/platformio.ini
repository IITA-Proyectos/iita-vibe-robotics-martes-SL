; PlatformIO — CALIBRACION EN QUIETO: linea, giroscopio y camara.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; NO MUEVE LOS MOTORES. Se puede tener en la mano, en la mesa o en la cancha:
; el robot no se escapa. Los motores van en pruebas/calibracion-moviendo/.
;
; Pensado para usarse SIN CABLE: se carga, se desenchufa el USB con la bateria
; puesta, se hacen las tres fases en la cancha, y se vuelve a enchufar SIN
; APAGAR LA BATERIA para leer el informe (queda en RAM y se repite cada 3 s).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/calibracion-quieto

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI
