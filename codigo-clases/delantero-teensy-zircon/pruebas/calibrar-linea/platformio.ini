; PlatformIO — calibrar los sensores de linea. NO mueve los motores.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; Necesita el monitor abierto SI o SI: el programa espera que la persona
; apriete ENTER entre fase y fase. Sin monitor no avanza, y eso es a
; proposito — ver la trampa 3 en la cabecera del .ino.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/calibrar-linea

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
