; PlatformIO — grabar los sensores de linea EN LA CANCHA, sin cable.
; NO mueve los motores. Tambien se abre tal cual con el Arduino IDE.
;
; No necesita el monitor para funcionar: graba solo, con la bateria
; puesta, y vuelca cuando se reenchufa el USB. Ver la cabecera del .ino.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/grabar-linea

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
