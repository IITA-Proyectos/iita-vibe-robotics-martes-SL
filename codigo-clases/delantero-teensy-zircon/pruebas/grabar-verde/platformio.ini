; PlatformIO — grabar el VERDE de la cancha en 5 puntos, SIN CABLE.
; NO mueve los motores. Tambien se abre tal cual con el Arduino IDE.
;
; Graba solo, con la bateria puesta, y vuelca cuando se reenchufa el USB
; y se le manda una tecla. El cable no llega a la cancha: por eso existe.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/grabar-verde

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
