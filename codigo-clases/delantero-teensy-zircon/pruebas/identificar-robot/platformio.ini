; PlatformIO — solo para compilar y cargar este sketch de prueba.
; El sketch tambien se puede abrir tal cual con el Arduino IDE:
; Herramientas -> Placa -> Teensy 4.1, Puerto -> el del Teensy, boton Subir.
;
; El build sale fuera del repo (build_dir) para no ensuciarlo.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/identificar-robot

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
