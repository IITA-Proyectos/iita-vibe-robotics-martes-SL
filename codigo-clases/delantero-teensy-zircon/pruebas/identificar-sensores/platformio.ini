; PlatformIO — identificar que numero de sensor es cada posicion fisica.
; NO mueve los motores. Se corre en la mesa, enchufado.
;
; Necesita el monitor: espera un ENTER entre paso y paso.
; OJO: abrir el puerto REINICIA el programa. Abrirlo UNA sola vez y
; dejarlo abierto toda la medicion. [aprendido el 2026-09-08]

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/identificar-sensores

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
