; PlatformIO — medir el VERDE de la cancha en 5 puntos. NO mueve los motores.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).
;
; Necesita el monitor abierto: espera un ENTER entre punto y punto.
; OJO: abrir el puerto REINICIA el programa. Hay que abrirlo UNA sola vez
; y dejarlo abierto toda la medicion. [aprendido a los golpes el 2026-09-08]

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/medir-verde

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
