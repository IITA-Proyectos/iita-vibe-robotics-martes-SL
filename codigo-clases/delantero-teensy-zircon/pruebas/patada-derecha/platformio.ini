; PlatformIO — prueba de patada recta del DELANTERO.
; Tambien se abre tal cual con el Arduino IDE (Placa -> Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/patada-derecha

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
; SPI va explicito aunque el .ino no lo incluya: Adafruit BusIO (que entra sola
; como dependencia del BNO055) tiene un Adafruit_SPIDevice.h que hace
; #include <SPI.h>. El buscador de dependencias de PlatformIO solo mira los
; #include de NUESTRO .ino, que pide Wire y no SPI, asi que sin esta linea el
; build muere con "fatal error: SPI.h: No such file or directory".
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI
