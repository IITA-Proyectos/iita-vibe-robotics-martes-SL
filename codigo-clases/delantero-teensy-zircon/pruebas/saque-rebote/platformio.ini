; PlatformIO — prueba del SAQUE CON REBOTE del DELANTERO.
; Tambien se abre tal cual con el Arduino IDE (Placa -> Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/saque-rebote

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
; SPI va explicito: Adafruit BusIO (dependencia del BNO055) lo pide y el
; buscador de PlatformIO no lo encuentra solo (ver patada-derecha).
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    SPI
