; PlatformIO — medir los sensores de linea. NO mueve los motores.
; Tambien se abre tal cual con el Arduino IDE (Teensy 4.1).

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../../.pio-build/sensores-de-linea

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
