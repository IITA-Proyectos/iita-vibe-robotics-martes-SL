; PlatformIO — TACTICAL CHALLENGE del DELANTERO (programa aparte del de partido).
; Tambien se abre tal cual con el Arduino IDE (Placa -> Teensy 4.1).
; No usa el giroscopio: solo camara, motores y linea.

[platformio]
src_dir = .
build_dir = ${PROJECT_DIR}/../../../.pio-build/tactical-challenge

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-gui
monitor_speed = 19200
